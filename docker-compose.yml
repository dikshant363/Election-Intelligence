services:
  postgres:
    image: postgres:16-alpine
    container_name: election_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: election_intelligence
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d election_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - election_net

volumes:
  postgres_data:
    driver: local

networks:
  election_net:
    driver: bridge
