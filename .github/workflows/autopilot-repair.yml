name: Autopilot Bounded Self-Repair

on:
  workflow_dispatch:
    inputs:
      issue_id:
        description: 'GitHub Issue Number to diagnose and repair'
        required: true
        default: '1'
      attempt_count:
        description: 'Current attempt number (1-3, max 3)'
        required: false
        default: '1'

concurrency:
  group: autopilot-repair-${{ inputs.issue_id }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  bounded-repair:
    name: Execute Bounded Self-Repair
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Bounded Repair Orchestrator
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/autopilot_repair.sh "${{ inputs.issue_id }}" "${{ inputs.attempt_count }}"
