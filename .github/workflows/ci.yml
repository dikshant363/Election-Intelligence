name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint, Compile & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-asyncio fastapi uvicorn pydantic sqlalchemy asyncpg argon2-cffi pyjwt

      - name: Lint Backend
        run: ruff check backend

      - name: Compile Backend
        run: python -m compileall backend

      - name: Run Backend Tests
        run: pytest

  flutter-test:
    name: Flutter Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Analyze Flutter Code
        run: |
          cd frontend
          flutter analyze

      - name: Run Flutter Tests
        run: |
          cd frontend
          flutter test

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t election-intelligence-platform:v1.0.0 .
