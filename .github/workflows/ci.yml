name: CI/CD Pipeline — Rust & Production Verification

on:
  push:
    branches: [ main, master, "feature/**" ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust-check:
    name: Rust Quality Gates & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check Code Formatting
        run: cargo fmt --all -- --check

      - name: Clippy Linter Check
        run: cargo clippy --all-targets --all-features -- -D warnings

  rust-test:
    name: PostgreSQL 17 Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: election_intelligence
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Stable Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install PostgreSQL Client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply Database Migrations and Seed Data
        run: |
          for f in $(ls migrations/*.sql | sort); do
            echo "Applying migration: $f"
            PGPASSWORD=password psql -h localhost -U postgres -d election_intelligence -f "$f"
          done

      - name: Run Test Suite
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/election_intelligence
        run: cargo test --all-features -- --nocapture

      - name: Compile Release Binary
        run: cargo build --release

  docker-build:
    name: Container Build & Healthcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: election-intelligence-platform:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
